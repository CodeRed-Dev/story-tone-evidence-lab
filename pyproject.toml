[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-storytelling-lab"
version = "0.1.0"
description = "A local reproduction and extension combining multilingual prompting with narrative analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
multistory = "multistory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
